name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ruff épinglé : un linter non versionné casse la CI au gré des releases
      # (0.16.x a durci isort → 47 écarts sur du code pré-existant inchangé).
      - run: pip install ruff==0.15.20
      - run: ruff check ifc_openshell_mcp tests
      - run: ruff format --check ifc_openshell_mcp tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bim-core (tagged JSON contracts + path sandbox)
        run: pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.4.0"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run smoke tests (in-memory IFC via ifcopenshell)
        run: pytest tests -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --sdist --wheel
      - run: twine check dist/*
